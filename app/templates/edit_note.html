{% extends "base.html" %}
{% block title %}编辑知识点 - 考研复习系统{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h1 class="card-title">✏️ 编辑知识点</h1>

    <form method="POST">
        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" id="title" name="title" class="form-input"
                   value="{{ note.title }}" required autofocus>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="subject-select">科目</label>
                <select id="subject-select" class="form-select" onchange="onSubjectChange(this)">
                    <option value="">请选择科目</option>
                    {% for s in subjects %}
                    <option value="{{ s }}" {% if s == note.subject %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                    <option value="__NEW__">➕ 新建科目...</option>
                </select>
                <input type="text" id="subject-new" name="subject" class="form-input"
                       style="display: none;" placeholder="输入新科目名称">
                <input type="hidden" id="subject-hidden" name="subject" value="{{ note.subject }}">
            </div>

            <div class="form-group">
                <label for="chapter">章节</label>
                <input type="text" id="chapter" name="chapter" class="form-input"
                       value="{{ note.chapter or '' }}" placeholder="如：第三章 线性表">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="difficulty">难度</label>
                <select id="difficulty" name="difficulty" class="form-select">
                    {% for i in range(1, 6) %}
                    <option value="{{ i }}" {% if i == note.difficulty %}selected{% endif %}>
                        {{ '⭐' * i }} {{ ['简单','较易','中等','较难','困难'][i-1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="mastery_level">掌握程度</label>
                <select id="mastery_level" name="mastery_level" class="form-select">
                    {% for i in range(0, 6) %}
                    <option value="{{ i }}" {% if i == note.mastery_level %}selected{% endif %}>
                        {% if i == 0 %}未掌握{% else %}{{ '●' * i }}{{ '○' * (5 - i) }}{% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="tags">标签（逗号分隔）</label>
            <input type="text" id="tags" name="tags" class="form-input"
                   value="{{ note.tags.all() | map(attribute='tag_name') | join(', ') }}">
        </div>

        <div class="form-group">
            <label class="form-checkbox">
                <input type="checkbox" name="is_mistake" {% if note.is_mistake %}checked{% endif %}>
                ⚠️ 标记为易错知识点
            </label>
        </div>

        <div class="form-group">
            <label for="content">内容（支持 Markdown）</label>
            <textarea id="content" name="content" class="form-textarea" required>{{ note.content }}</textarea>
        </div>

        <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">保存修改</button>
            <a href="{{ url_for('notes.note_detail', note_id=note.id) }}" class="btn btn-outline">取消</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function onSubjectChange(sel) {
    var newInput = document.getElementById('subject-new');
    var hidden = document.getElementById('subject-hidden');
    if (sel.value === '__NEW__') {
        newInput.style.display = 'block';
        newInput.focus();
        hidden.value = '';
        sel.style.display = 'none';
    } else {
        newInput.style.display = 'none';
        hidden.value = sel.value;
    }
}
</script>
{% endblock %}
