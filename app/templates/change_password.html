{% extends "base.html" %}
{% block title %}修改密码 - 考研复习系统{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>🔒 修改密码</h1>
        <p class="subtitle">定期更换密码保护账号安全</p>

        <form method="POST">
            <div class="form-group">
                <label for="old_password">原密码</label>
                <input type="password" id="old_password" name="old_password" class="form-input"
                       placeholder="请输入原密码" required autofocus>
            </div>

            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" name="new_password" class="form-input"
                       placeholder="至少6位新密码" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">确认新密码</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                       placeholder="再次输入新密码" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">确认修改</button>
        </form>
    </div>
</div>
{% endblock %}
